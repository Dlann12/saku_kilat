name: Build Saku Android APK

on:
  push:
    branches: [main]
    paths:
      - 'resources/**'
      - 'android/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
      - 'vite.capacitor.config.ts'
      - '.github/workflows/build-android-apk.yml'
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Opsional: URL default backend Laravel (contoh: http://192.168.1.10:8000)'
        required: false
        default: ''

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Capacitor static Vue bundle
        env:
          VITE_API_BASE_URL: ${{ github.event.inputs.api_base_url || '' }}
        run: npm run build:capacitor

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses & Install SDK 36
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMGR="$(command -v sdkmanager || find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMGR" ]; then
            echo "sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMGR" --licenses >/dev/null || true
          set -o pipefail
          "$SDKMGR" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Build Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Saku APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: saku-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

