services:
  postgres:
    image: postgres:16-alpine
    container_name: sakukilat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sakukilat
      POSTGRES_PASSWORD: sakukilat_dev_password
      POSTGRES_DB: sakukilat
      TZ: Asia/Jakarta
    ports:
      - "127.0.0.1:54330:5432"
    volumes:
      - sakukilat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sakukilat -d sakukilat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sakukilat_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - sakukilat_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sakukilat_pgdata:
  sakukilat_redisdata:

